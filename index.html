<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>專屬購車報價單｜限時有效</title>

  <!-- Threads / 社群分享預覽卡片設定（隱藏敏感車價） -->
  <meta property="og:title" content="您的專屬購車報價單｜限時有效">
  <meta property="og:description" content="此報價單為個人專屬加密連結，點擊查看完整車款配備與限時優惠。">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex, nofollow">

  <style>
    :root {
      --bg: #f3f5f8;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --danger: #dc2626;
      --line: #06c755;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: filter 0.15s ease;
    }

    /* 視窗失焦或切換分頁時自動模糊防窺 */
    body.privacy-blur {
      filter: blur(18px);
    }

    /* 封鎖列印功能 */
    @media print {
      body { display: none !important; }
    }

    /* 滿版斜向動態浮水印 */
    #watermark {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.14;
      background-repeat: repeat;
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(15, 23, 42, 0.08);
      overflow: hidden;
      margin-bottom: 16px;
    }

    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      padding: 20px 20px 18px;
    }

    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .badge {
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 10px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }

    .header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .sub-info {
      margin-top: 6px;
      font-size: 13px;
      color: #cbd5e1;
    }

    .body-section {
      padding: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .label {
      font-size: 14px;
      color: var(--muted);
    }

    .value {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      text-align: right;
    }

    /* 敏感價格防窺區塊 */
    .secret-box {
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
    }

    .secret-header {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .secret-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .secret-value {
      font-size: 20px;
      font-weight: 800;
      transition: filter 0.12s ease;
    }

    .secret-value.discount {
      color: var(--danger);
    }

    .secret-value.final {
      color: var(--accent);
      font-size: 24px;
    }

    .blurred {
      filter: blur(10px);
      opacity: 0.65;
    }

    /* 長按看底價按鈕 */
    .hold-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .hold-btn.holding {
      background: var(--accent);
      transform: scale(0.98);
    }

    /* 配備與備註 */
    .notes-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 14px;
      font-size: 14px;
      color: #334155;
      white-space: pre-wrap;
      word-break: break-word;
      margin-top: 8px;
    }

    /* 有效期限與提醒 */
    .meta-footer {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .expire-alert {
      color: var(--danger);
      font-weight: 600;
    }

    /* 導流加 LINE 按鈕 */
    .cta-btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: var(--line);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.28);
      margin-top: 12px;
    }

    /* 狀態頁（載入中 / 解鎖碼 / 過期失效） */
    .state-card {
      text-align: center;
      padding: 36px 24px;
    }

    .state-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .state-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .state-desc {
      font-size: 14px;
      color: var(--muted);
      margin: 0 0 20px;
    }

    .code-input {
      width: 180px;
      font-size: 24px;
      letter-spacing: 8px;
      text-align: center;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 10px;
      outline: none;
      margin-bottom: 14px;
      -webkit-user-select: text;
      user-select: text;
    }

    .code-input:focus {
      border-color: var(--accent);
    }

    .submit-btn {
      width: 180px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-top: 10px;
      min-height: 20px;
    }

    .hidden {
      display: none !important;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- 滿版動態浮水印層 -->
  <div id="watermark"></div>

  <div class="container">
    <!-- 1. 載入中畫面 -->
    <div id="view-loading" class="card state-card">
      <div class="spinner"></div>
      <div class="state-title">正在讀取專屬報價單</div>
      <div class="state-desc">系統驗證有效期限中，請稍候...</div>
    </div>

    <!-- 2. 輸入 4 碼解鎖碼畫面 -->
    <div id="view-unlock" class="card state-card hidden">
      <div class="state-icon">🔒</div>
      <div class="state-title">專屬報價已加密保護</div>
      <div class="state-desc">請輸入業務在 Threads 私訊提供的解鎖碼</div>
      <input id="code-input" class="code-input" type="tel" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off">
      <br>
      <button id="unlock-btn" class="submit-btn">解鎖查看報價</button>
      <div id="unlock-error" class="error-msg"></div>
    </div>

    <!-- 3. 錯誤 / 過期 / 作廢畫面 -->
    <div id="view-error" class="card state-card hidden">
      <div class="state-icon">⏳</div>
      <div id="error-title" class="state-title">報價單無法查看</div>
      <div id="error-desc" class="state-desc"></div>
      <a id="error-line-btn" class="cta-btn" href="#" target="_blank" rel="noopener">聯繫業務重新報價（加 LINE）</a>
    </div>

    <!-- 4. 報價單主畫面 -->
    <div id="view-quote" class="hidden">
      <div class="card">
        <div class="header">
          <div class="badge-row">
            <span class="badge" id="q-brand">專屬購車報價單</span>
            <span class="badge" id="q-views"></span>
          </div>
          <h1 id="q-model"></h1>
          <div class="sub-info">專屬客戶：<span id="q-threads"></span></div>
        </div>

        <div class="body-section">
          <div class="info-row">
            <span class="label">建議售價（牌價）</span>
            <span class="value" id="q-list-price"></span>
          </div>

          <!-- 敏感價格防窺區 -->
          <div class="secret-box">
            <div class="secret-header">
              <span>🔐 專案機密報價（防截圖保護）</span>
              <span id="reveal-status">已隱藏</span>
            </div>
            <div class="secret-row">
              <span class="label">空車現金折價</span>
              <span class="secret-value discount blurred" id="q-discount"></span>
            </div>
            <div class="secret-row">
              <span class="label">預估成交價</span>
              <span class="secret-value final blurred" id="q-final-price"></span>
            </div>
            <button id="hold-btn" class="hold-btn" type="button">👆 按住不放顯示專屬底價</button>
          </div>

          <!-- 配備與備註 -->
          <div id="notes-wrapper" class="hidden">
            <div class="label" style="font-weight: 600; color: var(--text);">配備明細與專案備註</div>
            <div class="notes-box blurred" id="q-notes"></div>
          </div>

          <!-- 有效期限與防外流聲明 -->
          <div class="meta-footer">
            <div id="q-expire" class="expire-alert"></div>
            <div>報價編號：<span id="q-id"></span> ｜ 查閱時間：<span id="q-time"></span></div>
            <div>※ 本報價單含個人專屬浮水印，僅供本人參考，請勿截圖外流。</div>
          </div>
        </div>
      </div>

      <a id="cta-line-btn" class="cta-btn" href="#" target="_blank" rel="noopener">
        對這份報價有興趣？點此加 LINE 鎖定優惠
      </a>
    </div>
  </div>

  <script>
    // ================= 必填設定區 =================
    const CONFIG = {
      // 1. 貼上你的 Google Apps Script 網頁應用程式網址（/exec 結尾）
      API_URL: 'https://script.google.com/macros/s/AKfycbyzx4QwcV3YpBuXhAMeoPdwCdG7NGy9eSC0iwb2v-_PCo5Pa6KriXdkafjBj8QXyFOJ-g/exec',

      // 2. 貼上你的 LINE 好友連結（或 LINE 官方帳號連結）
      LINE_URL: 'https://line.me/ti/p/dpeN20Ohl9',

      // 3. 報價單左上角標籤名稱（可改成你的品牌或稱呼）
      BRAND_TAG: '專屬購車報價單'
    };

    // ================= 系統主程式 =================
    const params = new URLSearchParams(window.location.search);
    const quoteId = (params.get('id') || '').trim();

    const views = {
      loading: document.getElementById('view-loading'),
      unlock: document.getElementById('view-unlock'),
      error: document.getElementById('view-error'),
      quote: document.getElementById('view-quote')
    };

    // 綁定 LINE 導流按鈕
    document.getElementById('cta-line-btn').href = CONFIG.LINE_URL;
    document.getElementById('error-line-btn').href = CONFIG.LINE_URL;
    document.getElementById('q-brand').textContent = CONFIG.BRAND_TAG;

    function showView(name) {
      Object.keys(views).forEach(k => views[k].classList.toggle('hidden', k !== name));
    }

    function showError(title, message) {
      document.getElementById('error-title').textContent = title;
      document.getElementById('error-desc').textContent = message;
      showView('error');
    }

    function formatMoney(val) {
      if (val === '' || val === null || val === undefined) return '-';
      const num = Number(val);
      if (!isNaN(num) && String(val).trim() !== '') {
        return 'NT$ ' + num.toLocaleString('zh-TW');
      }
      return String(val);
    }

    // 產生滿版斜向 SVG 浮水印
    function applyWatermark(threadsId, timeStr) {
      const text1 = threadsId || '專屬客戶';
      const text2 = timeStr || '';
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="240" height="170">
          <g transform="rotate(-26 120 85)" fill="#0f172a" font-family="sans-serif" font-weight="700">
            <text x="20" y="75" font-size="15">${escapeXml(text1)}</text>
            <text x="20" y="98" font-size="11">${escapeXml(text2)}</text>
          </g>
        </svg>
      `;
      const encoded = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      document.getElementById('watermark').style.backgroundImage = `url("${encoded}")`;
    }

    function escapeXml(str) {
      return String(str).replace(/[<>&'"]/g, c => ({
        '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;'
      }[c]));
    }

    // 呼叫 GAS 後端 API
    async function fetchQuote(code = '') {
      if (!quoteId) {
        showError('無效的報價單連結', '網址缺少報價單編號，請聯繫業務重新傳送連結。');
        return;
      }

      if (!code) showView('loading');

      try {
        const url = `${CONFIG.API_URL}?id=${encodeURIComponent(quoteId)}&code=${encodeURIComponent(code)}`;
        const res = await fetch(url);
        const result = await res.json();

        if (result.status === 'success') {
          renderQuote(result.data);
        } else if (result.status === 'need_code') {
          document.getElementById('unlock-error').textContent = '';
          showView('unlock');
        } else if (result.status === 'wrong_code') {
          document.getElementById('unlock-error').textContent = result.message || '解鎖碼錯誤，請重新輸入';
          document.getElementById('code-input').value = '';
          showView('unlock');
        } else {
          const titleMap = {
            expired: '報價單已過期',
            void: '報價單已失效',
            limit_reached: '已達查看次數上限',
            not_found: '找不到此報價單'
          };
          showError(titleMap[result.status] || '無法讀取報價單', result.message);
        }
      } catch (err) {
        showError('連線失敗', '無法連接報價伺服器，請檢查網路或稍後再試。');
      }
    }

    function renderQuote(data) {
      document.getElementById('q-model').textContent = data.carModel || '購車報價單';
      document.getElementById('q-threads').textContent = data.threadsId || '專屬客戶';
      document.getElementById('q-list-price').textContent = formatMoney(data.listPrice);
      document.getElementById('q-discount').textContent = formatMoney(data.discount);
      document.getElementById('q-final-price').textContent = formatMoney(data.finalPrice);
      document.getElementById('q-id').textContent = data.quoteId;
      document.getElementById('q-time').textContent = data.serverTime;

      const viewsEl = document.getElementById('q-views');
      if (data.maxViews > 0) {
        viewsEl.textContent = `查看次數 ${data.viewCount} / ${data.maxViews}`;
      } else {
        viewsEl.textContent = `第 ${data.viewCount} 次查看`;
      }

      const expireEl = document.getElementById('q-expire');
      expireEl.textContent = data.expireTime ? `⏰ 本報價有效期限至：${data.expireTime}` : '';

      if (data.notes) {
        document.getElementById('q-notes').textContent = data.notes;
        document.getElementById('notes-wrapper').classList.remove('hidden');
      }

      applyWatermark(data.threadsId, data.serverTime);
      showView('quote');
    }

    // 解鎖按鈕事件
    const unlockBtn = document.getElementById('unlock-btn');
    const codeInput = document.getElementById('code-input');
    function submitCode() {
      const code = codeInput.value.trim();
      if (!code) {
        document.getElementById('unlock-error').textContent = '請輸入解鎖碼';
        return;
      }
      unlockBtn.disabled = true;
      unlockBtn.textContent = '驗證中...';
      fetchQuote(code).finally(() => {
        unlockBtn.disabled = false;
        unlockBtn.textContent = '解鎖查看報價';
      });
    }
    unlockBtn.addEventListener('click', submitCode);
    codeInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });

    // 長按顯示底價防窺事件（相容 iOS / Android / Threads 內建瀏覽器）
    const holdBtn = document.getElementById('hold-btn');
    const secretEls = document.querySelectorAll('.secret-value, #q-notes');
    const revealStatus = document.getElementById('reveal-status');

    function revealSecrets(e) {
      if (e) e.preventDefault();
      secretEls.forEach(el => el.classList.remove('blurred'));
      holdBtn.classList.add('holding');
      holdBtn.textContent = '🔓 放開手指即自動隱藏';
      revealStatus.textContent = '顯示中';
    }

    function hideSecrets() {
      secretEls.forEach(el => el.classList.add('blurred'));
      holdBtn.classList.remove('holding');
      holdBtn.textContent = '👆 按住不放顯示底價與配備';
      revealStatus.textContent = '已隱藏';
    }

    holdBtn.addEventListener('touchstart', revealSecrets, { passive: false });
    holdBtn.addEventListener('touchend', hideSecrets);
    holdBtn.addEventListener('touchcancel', hideSecrets);
    holdBtn.addEventListener('mousedown', revealSecrets);
    window.addEventListener('mouseup', hideSecrets);
    holdBtn.addEventListener('mouseleave', hideSecrets);
    holdBtn.addEventListener('contextmenu', e => e.preventDefault());

    // 基礎前端防窺：禁止右鍵、切頁自動模糊
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        hideSecrets();
        document.body.classList.add('privacy-blur');
      } else {
        document.body.classList.remove('privacy-blur');
      }
    });
    window.addEventListener('blur', () => {
      hideSecrets();
      document.body.classList.add('privacy-blur');
    });
    window.addEventListener('focus', () => {
      document.body.classList.remove('privacy-blur');
    });

    // 啟動載入
    fetchQuote();
  </script>
</body>
</html>
